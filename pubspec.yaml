name: devavani
description: "Devavani - Calm & Elderly-Friendly Hindu Religious Daily Companion App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  just_audio: ^0.9.40
  audio_service: ^0.18.16
  flutter_local_notifications: ^22.3.1
  google_mobile_ads: ^9.1.0
  intl: ^0.19.0
  tithi_engine: ^5.2.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/audio/aarti/

