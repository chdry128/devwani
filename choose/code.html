  <!-- Interactive JavaScript for Elder-friendly 2-choice Selection -->
  <script>
    let selectedDeities = ['हनुमान जी', 'श्री गणेश'];

    function updateBadgeCount() {
      const countSpan = document.getElementById('selected-count-badge');
      if (countSpan) {
        countSpan.textContent = selectedDeities.length;
      }
      const submitBtn = document.getElementById('submit-btn');
      if (selectedDeities.length === 0) {
        submitBtn.classList.add('opacity-60');
      } else {
        submitBtn.classList.remove('opacity-60');
      }
    }

    function toggleDeity(cardEl, deityName) {
      const isSelected = cardEl.getAttribute('data-selected') === 'true';

      if (isSelected) {
        // Deselect
        cardEl.setAttribute('data-selected', 'false');
        cardEl.className = "deity-card group relative bg-white border border-[#EAD5C5] rounded-2xl p-2.5 shadow-warm-sm hover:border-[#D96510]/60 cursor-pointer flex flex-col items-center text-center";
        
        // Update badge check
        const badge = cardEl.querySelector('.badge-check');
        badge.className = "badge-check absolute top-2.5 right-2.5 w-7 h-7 rounded-full bg-white/90 border-2 border-[#D0BFB2] flex items-center justify-center shadow-sm z-10 opacity-70 group-hover:opacity-100";
        badge.innerHTML = '<div class="w-2 h-2 rounded-full bg-transparent"></div>';

        // Name color
        const nameSpan = cardEl.querySelector('span.text-lg');
        nameSpan.className = "text-lg font-bold text-[#2E231C] leading-tight pb-1";

        selectedDeities = selectedDeities.filter(d => d !== deityName);
      } else {
        // Enforce maximum 2 deities limit
        if (selectedDeities.length >= 2) {
          // Alert or feedback for elderly: Replace oldest or show soft note
          alert("आप अधिकतम २ देवताओं को ही चुन सकते हैं। कृपया पहले से चुने किसी देवता को हटाकर पुनः चुनें।");
          return;
        }

        // Select
        cardEl.setAttribute('data-selected', 'true');
        cardEl.className = "deity-card group relative bg-[#FFF3E8] border-2 border-[#D96510] rounded-2xl p-2.5 shadow-active-card cursor-pointer flex flex-col items-center text-center ring-2 ring-[#D96510]/30";
        
        // Update badge check
        const badge = cardEl.querySelector('.badge-check');
        badge.className = "badge-check absolute top-2.5 right-2.5 w-7 h-7 rounded-full bg-[#D96510] text-white flex items-center justify-center shadow-md z-10";
        badge.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>';

        // Name color
        const nameSpan = cardEl.querySelector('span.text-lg');
        nameSpan.className = "text-lg font-bold text-[#A64B0A] leading-tight pb-1";

        selectedDeities.push(deityName);
      }

      updateBadgeCount();
    }

    updateBadgeCount();
  </script>
